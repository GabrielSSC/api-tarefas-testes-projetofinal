# Porta diferente das mais usadas (8080 e 8008).
server.port=8095

# H2 em memória: não precisa instalar um servidor de banco de dados.
spring.datasource.url=jdbc:h2:mem:tarefasdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas automaticamente ao iniciar a aplicação.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console do H2 (opcional para explorar o banco).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
